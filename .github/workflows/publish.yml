name: Publish to npm

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: >
          Dry run — print the version and npm dist-tag that would be used; no commit or publish.
          Pick the branch to publish from with the "Use workflow from" dropdown.
          Non-default branches publish to the npm dist-tag `beta` (not `latest`).
        required: false
        default: false
        type: boolean
      skip_versioning:
        description: >
          Skip version bump — use the version already in the repo
          (e.g. retry after npm publish failed but the release commit is already pushed).
        required: false
        default: false
        type: boolean
      version_override:
        description: >
          Optional. Full semver to publish (e.g. 12.6.0-beta.2). Skips conventional bump when set.
          Leave empty for automatic versioning.
        required: false
        default: ''
        type: string

permissions:
  contents: write
  id-token: write

jobs:
  ci:
    uses: ./.github/workflows/build.yml

  # Works out the version and dist-tag without committing or publishing, so the
  # person approving the publish job can check them first. This is also the
  # whole of a dry run.
  preview:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      sha: ${{ steps.sha.outputs.sha }}
      dist_tag: ${{ steps.dist.outputs.dist_tag }}
      version: ${{ steps.version.outputs.version }}
      version_command: ${{ steps.command.outputs.version_command }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Record commit
        id: sha
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.x

      - name: Install dependencies
        run: npm ci

      - name: Determine Dist Tag
        id: dist
        env:
          VERSION_OVERRIDE: ${{ inputs.version_override }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          DIST_TAG=$([[ "${VERSION_OVERRIDE}" == *"-beta."* ||  "${REF_NAME}" != "${DEFAULT_BRANCH}" ]] && echo "beta" || echo "latest")
          echo "dist_tag=$DIST_TAG" >> "$GITHUB_OUTPUT"
          echo "NPM distribution tag: $DIST_TAG"

      # The publish job runs this exact command, so the version shown here is
      # the version that gets published.
      - name: Build version command
        id: command
        env:
          VERSION_OVERRIDE: ${{ inputs.version_override }}
          DIST_TAG: ${{ steps.dist.outputs.dist_tag }}
        run: |
          set -euo pipefail
          VERSION_COMMAND="npx lerna version"
          if [ -n "${VERSION_OVERRIDE}" ]; then
            VERSION_COMMAND="${VERSION_COMMAND} ${VERSION_OVERRIDE}"
          fi
          if [ "${DIST_TAG}" = "latest" ]; then
            VERSION=$(node -p "require('./packages/blockly/package.json').version")
            if [[ "${VERSION}" == *"-beta."* ]]; then
              VERSION_COMMAND="${VERSION_COMMAND} --conventional-graduate"
            fi
          else
            # --ignore-scripts skips the "version" lifecycle script during beta release to skip generating docs
            VERSION_COMMAND="${VERSION_COMMAND} --conventional-prerelease --preid beta --ignore-scripts"
          fi
          VERSION_COMMAND="${VERSION_COMMAND} --force-publish --conventional-commits --yes"
          echo "version_command=${VERSION_COMMAND}" >> "$GITHUB_OUTPUT"
          echo "${VERSION_COMMAND}"

      - name: Preview version
        if: ${{ !inputs.skip_versioning }}
        env:
          VERSION_COMMAND: ${{ steps.command.outputs.version_command }}
        run: |
          set -euo pipefail
          # Bump package.json files locally only: no commit, tag or push.
          PREVIEW_COMMAND="${VERSION_COMMAND} --no-push --no-git-tag-version"
          if [[ "${PREVIEW_COMMAND}" != *"--ignore-scripts"* ]]; then
            PREVIEW_COMMAND="${PREVIEW_COMMAND} --ignore-scripts"
          fi
          eval "$PREVIEW_COMMAND"

      - name: Read version
        id: version
        run: |
          VERSION=$(node -p "require('./packages/blockly/package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Summary
        env:
          VERSION: ${{ steps.version.outputs.version }}
          DIST_TAG: ${{ steps.dist.outputs.dist_tag }}
          SHA: ${{ steps.sha.outputs.sha }}
          REF_NAME: ${{ github.ref_name }}
          DRY_RUN: ${{ inputs.dry_run }}
          SKIP_VERSIONING: ${{ inputs.skip_versioning }}
        run: |
          if [ "${DRY_RUN}" = "true" ]; then
            HEADING="Dry run: nothing will be published"
          else
            HEADING="Check before approving the publish job"
          fi
          if [ "${DIST_TAG}" = "beta" ]; then
            RELEASE_TYPE="prerelease"
          else
            RELEASE_TYPE="full release"
          fi
          if [ "${SKIP_VERSIONING}" = "true" ]; then
            BUMP="skipped (publishing the version already in the repo)"
          else
            BUMP="yes"
          fi
          echo "::notice title=Release preview::blockly ${VERSION} to npm dist-tag ${DIST_TAG}"
          {
            echo "## Release preview"
            echo
            echo "**${HEADING}**"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| Version | \`${VERSION}\` |"
            echo "| npm dist-tag | \`${DIST_TAG}\` |"
            echo "| GitHub release | ${RELEASE_TYPE} \`blockly-v${VERSION}\` |"
            echo "| Version bump | ${BUMP} |"
            echo "| Branch | \`${REF_NAME}\` |"
            echo "| Commit | \`${SHA}\` |"
            echo
            echo "All packages are published at this version."
          } >> "$GITHUB_STEP_SUMMARY"

  publish:
    needs: preview
    runs-on: ubuntu-latest
    # Don't try to publish from a fork of RaspberryPiFoundation/blockly.
    if: ${{ !inputs.dry_run && github.repository_owner == 'RaspberryPiFoundation' }}
    environment: release
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
          ssh-key: ${{ secrets.DEPLOY_PRIVATE_KEY }}

      # This uses a reverse-engineered email for the github actions bot. See
      # https://github.com/actions/checkout/issues/13#issuecomment-724415212
      - name: Git Identity
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email '41898282+github-actions[bot]@users.noreply.github.com'

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.x
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # If the branch moved while waiting for approval, the version could differ
      # from the one that was approved, so stop before anything is pushed.
      - name: Check commit matches preview
        env:
          PREVIEW_SHA: ${{ needs.preview.outputs.sha }}
        run: |
          HEAD_SHA=$(git rev-parse HEAD)
          if [ "${HEAD_SHA}" != "${PREVIEW_SHA}" ]; then
            echo "::error title=Branch changed since preview::Previewed ${PREVIEW_SHA} but the branch is now at ${HEAD_SHA}. Re-run the workflow to preview the new version." >&2
            exit 1
          fi

      - name: Version
        if: ${{ !inputs.skip_versioning }}
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION_COMMAND: ${{ needs.preview.outputs.version_command }}
        run: |
          set -euo pipefail
          eval "$VERSION_COMMAND"

      # Last guard before npm: the release commit is already pushed by now.
      - name: Check version matches preview
        env:
          PREVIEW_VERSION: ${{ needs.preview.outputs.version }}
        run: |
          VERSION=$(node -p "require('./packages/blockly/package.json').version")
          if [ "${VERSION}" != "${PREVIEW_VERSION}" ]; then
            echo "::error title=Version differs from preview::Previewed ${PREVIEW_VERSION} but versioning produced ${VERSION}." >&2
            exit 1
          fi

      - name: Build core package
        working-directory: packages/blockly
        run: npm run package

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          SKIP_VERSIONING: ${{ inputs.skip_versioning }}
          DIST_TAG: ${{ needs.preview.outputs.dist_tag }}
        run: |
          if [ "${SKIP_VERSIONING}" = "true" ]; then
            npx lerna publish from-package --yes --dist-tag ${DIST_TAG} --loglevel silly
          else
            npx lerna publish from-git --yes --dist-tag ${DIST_TAG} --loglevel silly
          fi

      - name: Create tarball
        working-directory: packages/blockly
        run: npm pack ./dist
        
      - name: Create GitHub release
        working-directory: packages/blockly
        env:
          GH_TOKEN: ${{ github.token }}
          DIST_TAG: ${{ needs.preview.outputs.dist_tag }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TARBALL="blockly-${VERSION}.tgz"
          if [ "${DIST_TAG}" == "beta" ]; then
            gh release create "blockly-v${VERSION}" "$TARBALL" \
              --repo "$GITHUB_REPOSITORY" \
              --title "blockly-v${VERSION}" \
              --generate-notes \
              --prerelease
          else
            gh release create "blockly-v${VERSION}" "$TARBALL" \
              --repo "$GITHUB_REPOSITORY" \
              --title "blockly-v${VERSION}" \
              --generate-notes
          fi
